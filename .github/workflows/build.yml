name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name StudioAgent --collect-submodules keyring run.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/StudioAgent.exe out/
          Copy-Item README.md out/
          Compress-Archive -Path out/* -DestinationPath StudioAgent-Windows.zip -Force
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Studio Agent v1.0.${{ github.run_number }}
          make_latest: true
          files: |
            dist/StudioAgent.exe
            StudioAgent-Windows.zip
